services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audience
      POSTGRES_USER: audience
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audience_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience -d audience"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://audience:${POSTGRES_PASSWORD:-audience_local}@postgres:5432/audience
      REDIS_URL: redis://redis:6379/0
      DATA_MODE: ${DATA_MODE:-demo}
      VK_TOKEN: ${VK_TOKEN:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MAX_GROUPS: ${MAX_GROUPS:-3}
      MAX_MEMBERS_PER_GROUP: ${MAX_MEMBERS_PER_GROUP:-500}
      MAX_POSTS: ${MAX_POSTS:-10}
      MAX_REACTIONS_PER_POST: ${MAX_REACTIONS_PER_POST:-200}
      MAX_USERS: ${MAX_USERS:-3000}
      MAX_CITY_LOOKUPS: ${MAX_CITY_LOOKUPS:-20}
      POST_SEARCH_DAYS: ${POST_SEARCH_DAYS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Изолированная тестовая БД: тесты не очищают пользовательские данные.
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: audience_test
      POSTGRES_USER: audience_test
      POSTGRES_PASSWORD: test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience_test -d audience_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    profiles: ["test"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://audience_test:test_only@postgres-test:5432/audience_test
      TEST_REDIS_URL: redis://redis-test:6379/0
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

volumes:
  postgres_data:
